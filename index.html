<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandingkan Harga</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e5e7eb;--soft:#eef2ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111320;--card:#1b1e30;--tx:#eef0f8;--mut:#9aa1b5;--pri:#818cf8;--bd:#2c3050;--soft:#24284a}}
:root[data-theme="dark"]{--bg:#111320;--card:#1b1e30;--tx:#eef0f8;--mut:#9aa1b5;--pri:#818cf8;--bd:#2c3050;--soft:#24284a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 4px}
.mut{color:var(--mut);font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.card.win{border:2px solid var(--ok)}
.hd{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.hd input{flex:1}
.x{border:0;background:var(--soft);color:var(--bad);border-radius:10px;width:36px;height:36px;font-size:18px}
input,select{width:100%;padding:11px;font-size:17px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.g{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--soft);color:var(--pri);font-size:16px;font-weight:700}
.big{font-size:22px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.badge{background:var(--ok);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--soft);margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.win .bar i{background:var(--ok)}
.sum{background:var(--soft);border-radius:14px;padding:14px;font-size:16px;line-height:1.6}
.warn{background:rgba(220,38,38,.12);color:var(--bad);border-radius:12px;padding:10px;font-size:14px;margin:10px 0}
.tip{margin-top:12px;font-size:13px}
</style>
</head>
<body>
<div class="app">
<h1>🛒 Bandingkan Harga</h1>
<div class="mut">Isi harga dan isi bersih tiap produk. Aplikasi menghitung harga per satuan agar adil dibandingkan.</div>
<div id="list"></div>
<button class="btn" id="add">+ Tambah produk</button>
<div id="out"></div>
<div class="mut tip">💡 Cek juga tanggal kedaluwarsa dan seberapa cepat kamu menghabiskannya. Murah per satuan tidak berguna kalau akhirnya terbuang.</div>
</div>
<script>
const $=id=>document.getElementById(id);
const U={ml:["vol",1],L:["vol",1000],g:["mass",1],kg:["mass",1000],pcs:["cnt",1]};
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const rp1=n=>"Rp"+(Math.round(n*10)/10).toLocaleString("id-ID",{minimumFractionDigits:0,maximumFractionDigits:1});
const pc=n=>(Math.round(n*10)/10).toString().replace(".",",")+"%";
const nm=s=>parseFloat(String(s).replace(/\./g,"").replace(",","."))||0;
let P=[{n:"Sabun A",p:18000,q:500,u:"ml"},{n:"Sabun B",p:25000,q:750,u:"ml"}];
function build(){
  $("list").innerHTML="";
  P.forEach((x,i)=>{
    const d=document.createElement("div");d.className="card";d.id="c"+i;
    d.innerHTML=`<div class="hd"><input data-i="${i}" data-k="n" value="${x.n}" aria-label="Nama produk">${P.length>2?`<button class="x" data-del="${i}" aria-label="Hapus">×</button>`:""}</div>
    <div class="g"><div><label>Harga (Rp)</label><input data-i="${i}" data-k="p" inputmode="numeric" value="${x.p.toLocaleString("id-ID")}"></div>
    <div><label>Isi bersih</label><input data-i="${i}" data-k="q" inputmode="decimal" value="${String(x.q).replace(".",",")}"></div>
    <div><label>Satuan</label><select data-i="${i}" data-k="u">${Object.keys(U).map(u=>`<option ${u===x.u?"selected":""}>${u}</option>`).join("")}</select></div></div>
    <div id="r${i}" style="margin-top:12px"></div>`;
    $("list").appendChild(d);
  });
  $("list").querySelectorAll("[data-i]").forEach(e=>{
    e.oninput=()=>{
      const x=P[e.dataset.i],k=e.dataset.k;
      if(k==="n")x.n=e.value;
      else if(k==="u")x.u=e.value;
      else if(k==="p"){x.p=nm(e.value);e.value=x.p?x.p.toLocaleString("id-ID"):""}
      else x.q=nm(e.value);
      calc()};
  });
  $("list").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{P.splice(b.dataset.del,1);build()});
  $("add").hidden=P.length>=4;
  calc();
}
function calc(){
  const fam=U[P[0].u][0];
  const ok=P.every(x=>U[x.u][0]===fam);
  const base=fam==="vol"?100:fam==="mass"?100:1,bu=fam==="vol"?"ml":fam==="mass"?"g":"pcs";
  const lab=base===1?"per 1 pcs":"per 100 "+bu;
  if(!ok){$("out").innerHTML=`<div class="warn">⚠️ Satuan tidak sebanding (misalnya ml dengan gram). Samakan jenis satuannya.</div>`;P.forEach((_,i)=>$("r"+i).innerHTML="");return}
  const v=P.map(x=>x.q>0&&x.p>0?x.p/(x.q*U[x.u][1])*base:null);
  const valid=v.filter(a=>a!==null);
  if(valid.length<2){$("out").innerHTML="";P.forEach((_,i)=>$("r"+i).innerHTML="");return}
  const mn=Math.min(...valid),mx=Math.max(...valid);
  P.forEach((x,i)=>{
    document.getElementById("c"+i).classList.toggle("win",v[i]===mn&&mn!==mx);
    $("r"+i).innerHTML=v[i]===null?"":`<div class="row"><span class="big">${rp1(v[i])}</span><span>${v[i]===mn&&mn!==mx?'<span class="badge">🏆 Termurah</span>':'<span class="mut">'+lab+'</span>'}</span></div>
    <div class="bar"><i style="width:${v[i]/mx*100}%"></i></div>
    <div class="mut">${rp(x.p)} ÷ ${String(x.q).replace(".",",")} ${x.u}${U[x.u][1]>1?" ("+(x.q*U[x.u][1]).toLocaleString("id-ID")+" "+bu+")":""} × ${base} = <b>${rp1(v[i])}</b> ${lab}</div>`;
  });
  const wi=v.indexOf(mn),hi=v.indexOf(mx);
  $("out").innerHTML=mn===mx?`<div class="sum">Harga per satuannya <b>sama persis</b>. Pilih sesuai kebutuhan.</div>`
   :`<div class="sum">🏆 <b>${P[wi].n||"Produk "+(wi+1)}</b> paling hemat <b>${lab}</b>.<br>Lebih murah <b>${pc((mx-mn)/mx*100)}</b> dibanding <b>${P[hi].n||"Produk "+(hi+1)}</b> (yang termahal).</div>`;
}
$("add").onclick=()=>{P.push({n:"Produk "+(P.length+1),p:0,q:0,u:P[0].u});build()};
build();
</script>
</body>
</html>
